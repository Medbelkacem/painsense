[tool.ruff]
line-length = 96

[tool.ruff.lint]
# Enabled for the deliberately late imports in tests/conftest.py, which carry a noqa.
extend-select = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Raised inside starlette's TestClient, which touches a deprecated anyio alias.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
